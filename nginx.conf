# Configuração Nginx para hanorkbot.com
# Coloque em: /etc/nginx/sites-available/hanorkbot.com
# Ative com: sudo ln -s /etc/nginx/sites-available/hanorkbot.com /etc/nginx/sites-enabled/
# Teste com: sudo nginx -t
# Recarregue: sudo systemctl reload nginx

server {
    listen 80;
    server_name hanorkbot.com www.hanorkbot.com;

    # Redirecionar tudo para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hanorkbot.com www.hanorkbot.com;

    # Certificado SSL (gerado pelo Certbot)
    # sudo certbot --nginx -d hanorkbot.com -d www.hanorkbot.com
    ssl_certificate     /etc/letsencrypt/live/hanorkbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanorkbot.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header X-Frame-Options       DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "no-referrer" always;

    # Limite de body (webhook MP envia JSON pequeno)
    client_max_body_size 1m;

    # Proxy para o bot Node.js (porta 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|db|db-shm|db-wal|lock)$ {
        deny all;
    }
}
