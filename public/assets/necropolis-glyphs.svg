<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="ng-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#b8954a"/>
    </linearGradient>
    <linearGradient id="ng-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030104" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Caveira -->
    <symbol id="glyph-skull" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1.2" stroke-linejoin="round"
        d="M32 10c-9.5 0-17 7-17 16 0 5 1.8 9.2 4.5 12l-1.5 9 5-2 2.5 8 3.5-3.5h6L33 45l2 8 5 2-1.5-9c2.7-2.8 4.5-7 4.5-12 0-9-7.5-16-17-16z"/>
      <ellipse cx="26" cy="24" rx="3.2" ry="4" fill="#0a0612" stroke="#a855f7" stroke-width="0.8"/>
      <ellipse cx="38" cy="24" rx="3.2" ry="4" fill="#0a0612" stroke="#a855f7" stroke-width="0.8"/>
      <path fill="none" stroke="#a855f7" stroke-width="0.9" stroke-linecap="round"
        d="M28 34h8M26 38c2 2 10 2 12 0"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.6" opacity="0.7"
        d="M22 48v4M28 50v3M32 51v2M36 50v3M42 48v4"/>
    </symbol>

    <!-- Lâminas cruzadas -->
    <symbol id="glyph-blades" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1" stroke-linejoin="round"
        d="M12 52 L32 14 L52 52 Z"/>
      <path fill="none" stroke="#a855f7" stroke-width="1.2" stroke-linecap="round"
        d="M18 52 L46 52 M32 14 L32 52"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.8"
        d="M32 14 L28 22 M32 14 L36 22"/>
      <path fill="url(#ng-fill)" stroke="#9333ea" stroke-width="1"
        d="M8 54h48v3H8z M28 54v6h8v-6"/>
      <path fill="none" stroke="#c4b5fd" stroke-width="0.9" transform="rotate(-42 32 32)"
        d="M32 6 L34 48 M26 14 L38 46"/>
      <path fill="none" stroke="#c4b5fd" stroke-width="0.9" transform="rotate(42 32 32)"
        d="M32 6 L34 48 M26 14 L38 46"/>
    </symbol>

    <!-- Corrente -->
    <symbol id="glyph-chain" viewBox="0 0 64 64">
      <g fill="none" stroke="url(#ng-stroke)" stroke-width="1.3">
        <ellipse cx="32" cy="10" rx="8" ry="5"/>
        <ellipse cx="32" cy="22" rx="8" ry="5"/>
        <ellipse cx="32" cy="34" rx="8" ry="5"/>
        <ellipse cx="32" cy="46" rx="8" ry="5"/>
        <ellipse cx="32" cy="58" rx="8" ry="5"/>
        <path stroke="#b8954a" stroke-width="0.7" opacity="0.8"
          d="M24 10v12M40 10v12M24 22v12M40 22v12M24 34v12M40 34v12M24 46v12M40 46v12"/>
      </g>
    </symbol>

    <!-- Coroa -->
    <symbol id="glyph-crown" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1.1" stroke-linejoin="round"
        d="M10 44 L16 22 L24 34 L32 16 L40 34 L48 22 L54 44 Z"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.9"
        d="M10 44h44v6H10z"/>
      <circle cx="16" cy="22" r="2" fill="#9333ea"/>
      <circle cx="32" cy="16" r="2.5" fill="#a855f7"/>
      <circle cx="48" cy="22" r="2" fill="#9333ea"/>
      <path fill="none" stroke="#c4b5fd" stroke-width="0.6" opacity="0.6"
        d="M14 47h36M18 47v2M26 47v2M32 47v2M38 47v2M46 47v2"/>
    </symbol>

    <!-- Rosa gótica -->
    <symbol id="glyph-rose" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="#9333ea" stroke-width="1"
        d="M32 28c-6-8-14-4-12 4 2 6 8 8 12 8s10-2 12-8c2-8-6-12-12-4z"/>
      <path fill="none" stroke="#a855f7" stroke-width="0.9"
        d="M32 36v22M32 44c-8 4-14 2-18-2M32 44c8 4 14 2 18-2"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.7"
        d="M26 52l-4 8M38 52l4 8"/>
      <circle cx="32" cy="26" r="3" fill="#1a0a2e" stroke="#c4b5fd" stroke-width="0.8"/>
    </symbol>

    <!-- Lua crescente -->
    <symbol id="glyph-moon" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1.1"
        d="M42 12c-12 2-20 14-18 26 2 10 10 18 20 20-14-4-24-18-22-32 1-8 6-14 12-18 2-1 6-2 8-1z"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.6" opacity="0.5"
        d="M14 48c4 6 12 10 20 10"/>
      <circle cx="46" cy="18" r="1.2" fill="#c4b5fd" opacity="0.8"/>
      <circle cx="52" cy="28" r="0.8" fill="#c4b5fd" opacity="0.5"/>
    </symbol>

    <!-- Cálice -->
    <symbol id="glyph-chalice" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1.1" stroke-linejoin="round"
        d="M20 18h24l-4 22c-1 6-7 10-8 10s-7-4-8-10L20 18z"/>
      <path fill="none" stroke="#a855f7" stroke-width="1"
        d="M32 50v8M24 58h16"/>
      <ellipse cx="32" cy="18" rx="14" ry="3" fill="none" stroke="#b8954a" stroke-width="0.9"/>
      <path fill="#9333ea" fill-opacity="0.35" stroke="none"
        d="M24 22h16c-2 8-5 14-8 16-3-2-6-8-8-16z"/>
    </symbol>

    <!-- Asas / corvo -->
    <symbol id="glyph-wings" viewBox="0 0 64 64">
      <path fill="url(#ng-fill)" stroke="url(#ng-stroke)" stroke-width="1" stroke-linejoin="round"
        d="M32 34c-10-12-22-10-26 2-2 6 0 14 8 18-6-10-4-20 6-24 4-2 8-2 12 0 4-2 8-2 12 0 10 4 12 14 6 24 8-4 10-12 8-18-4-12-16-14-26-2z"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.7" opacity="0.7"
        d="M32 34v14M28 40l-6 4M36 40l6 4"/>
    </symbol>

    <!-- Ornamento canto (flourish) -->
    <symbol id="glyph-corner" viewBox="0 0 64 64">
      <path fill="none" stroke="url(#ng-stroke)" stroke-width="1.2" stroke-linecap="round"
        d="M4 4h20M4 4v20"/>
      <path fill="none" stroke="#b8954a" stroke-width="0.8" opacity="0.75"
        d="M4 4c8 0 12 4 16 12M4 4c0 8 4 12 12 16"/>
      <circle cx="4" cy="4" r="2" fill="#9333ea" opacity="0.8"/>
    </symbol>
  </defs>
</svg>
