# SP-8 — Grafana + Prometheus local (Hanork /metrics)
# Uso: docker compose -f observability/docker-compose.yml up -d
# Grafana: http://localhost:3001 (admin / HANORK_GRAFANA_PASS ou hanork)
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hanork-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.2.2
    container_name: hanork-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${HANORK_GRAFANA_PASS:-hanork}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  grafana-data:
