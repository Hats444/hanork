apiVersion: 1
groups:
  - orgId: 1
    name: Hanork Orders
    folder: Hanork
    interval: 1m
    rules:
      - uid: hanork-stuck-paid-orders
        title: Hanork Stuck PAID Orders
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Pedidos PAID sem entrega detectados
          description: "hanork_stuck_paid_orders = {{ $values.A.Value }} — verificar fila delivery e logs [DELIVERY]."
        labels:
          severity: warning
          service: hanork-bot
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: hanork-prometheus
            model:
              expr: hanork_stuck_paid_orders
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
