# Scrape Hanork bot Express /metrics (host machine)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hanork-alerts.yml

scrape_configs:
  - job_name: hanork
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: hanork-bot
